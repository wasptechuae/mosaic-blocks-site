<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1428">
<title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preload" href="{{ '/assets/fonts/readex-pro-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<header class="top"><a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/mark.svg' | relative_url }}" alt="" width="34" height="34"><span>Mosaic Blocks</span></a>
<nav aria-label="Pages"><a href="{{ '/privacy/' | relative_url }}">Privacy</a><a href="{{ '/support/' | relative_url }}">Support</a></nav></header>
<main><article class="card">
{{ content }}
</article></main>
<footer>Contact: <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a></footer>
</body>
</html>
